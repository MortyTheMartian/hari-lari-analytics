[project]
name = "hari-lari-analytics"
version = "0.1.0"
description = "How Hari Lari analyzes its Moka POS sales data: cleaning, KPIs, PDF and Excel reports"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Moritz" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "plottable>=0.1.5",
    "pyarrow>=18.0.0",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-storage>=2.18.0",
]

[project.scripts]
hari-lari-report = "hari_lari_analytics.orchestration.report_cli:main"
hari-lari-extract = "hari_lari_analytics.sources.moka.cli:main"
hari-lari-telegram = "hari_lari_analytics.distribution.cli:main"
hari-lari-drive = "hari_lari_analytics.distribution.drive_cli:main"
hari-lari-component = "hari_lari_analytics.orchestration.cli:main"
hari-lari-warehouse = "hari_lari_analytics.orchestration.warehouse_cli:main"
hari-lari-runs = "hari_lari_analytics.orchestration.runs_cli:main"
hari-lari-pipeline = "hari_lari_analytics.orchestration.pipeline_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The one-off probe of the Moka API (kept for reference) uses long lines and one-line ifs.
"extraction/moka/probe_schema.py" = ["E501", "E701"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# docs/architecture.md. Each module may import only the modules below it.
# sources and distribution sit outside the chain: they import only core.
[tool.importlinter]
root_package = "hari_lari_analytics"

[[tool.importlinter.contracts]]
name = "Module layers"
type = "layers"
layers = [
    "hari_lari_analytics.orchestration",
    "hari_lari_analytics.presentation",
    "hari_lari_analytics.analysis",
    "hari_lari_analytics.semantic",
    "hari_lari_analytics.warehouse",
    "hari_lari_analytics.core",
]

[[tool.importlinter.contracts]]
name = "Sources and distribution import only core"
type = "forbidden"
source_modules = [
    "hari_lari_analytics.sources",
    "hari_lari_analytics.distribution",
]
forbidden_modules = [
    "hari_lari_analytics.warehouse",
    "hari_lari_analytics.semantic",
    "hari_lari_analytics.analysis",
    "hari_lari_analytics.presentation",
    "hari_lari_analytics.orchestration",
    "hari_lari_analytics.sources",
    "hari_lari_analytics.distribution",
]

[[tool.importlinter.contracts]]
name = "Sources and distribution are independent"
type = "independence"
modules = [
    "hari_lari_analytics.sources",
    "hari_lari_analytics.distribution",
]
