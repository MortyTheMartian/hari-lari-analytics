[project]
name = "hari-lari-analytics"
version = "0.1.0"
description = "How Hari Lari analyzes its Moka POS sales data: cleaning, KPIs, PDF and Excel reports"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Moritz" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "plottable>=0.1.5",
]

[project.scripts]
hari-lari-report = "hari_lari_analytics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
