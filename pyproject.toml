[project]
name = "hari-lari-analytics"
version = "0.1.0"
description = "How Hari Lari analyzes its Moka POS sales data: cleaning, KPIs, PDF and Excel reports"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Moritz" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "plottable>=0.1.5",
    "pyarrow>=18.0.0",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-storage>=2.18.0",
]

[project.scripts]
hari-lari-report = "hari_lari_analytics.cli:main"
hari-lari-extract = "hari_lari_analytics.extract.cli:main"
hari-lari-telegram = "hari_lari_analytics.deliver.cli:main"
hari-lari-drive = "hari_lari_analytics.deliver.drive_cli:main"
hari-lari-weekly = "hari_lari_analytics.weekly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
